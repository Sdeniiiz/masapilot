databases:
  - name: masapilot-db
    plan: free
    region: frankfurt
    databaseName: masapilot
    user: masapilot_user

services:
  - type: web
    name: masapilot
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 8080
      - key: RuntimeMode
        value: Cloud
      - key: DATABASE_URL
        fromDatabase:
          name: masapilot-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: masapilot-db
          property: connectionString
